<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            color: #333;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            color: #fff;
            animation: fadeInDown 1s ease-in-out;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        header p {
            font-size: 1.2rem;
            color: #eee;
            margin-bottom: 20px;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-buttons button {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #fff;
            color: #333;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .nav-buttons button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        .card-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            padding: 50px 20px;
        }

        .card {
            max-width: 300px;
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .disaster { border-top: 5px solid #ff4d4d; }
        .transport { border-top: 5px solid #4d79ff; }
        .civic { border-top: 5px solid #33cc33; }

        /* User Details Section */
        #userDetails {
            display: none;
            background: #fff;
            margin: 30px auto;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        #userDetails button {
            margin-top: 15px;
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            background: #4d79ff;
            color: white;
            cursor: pointer;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .modal-content {
            background: #fff;
            margin: 10% auto;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            position: relative;
            text-align: center;
        }

        .modal-content input {
            width: 85%;
            padding: 10px;
            margin: 10px 0;
        }

        .modal-content button {
            padding: 10px 25px;
            background: #4d79ff;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .close {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 25px;
            cursor: pointer;
        }

        @keyframes fadeInDown {
            from {opacity:0; transform:translateY(-40px);}
            to {opacity:1; transform:translateY(0);}
        }
    </style>
</head>

<body>

<header>
    <h1>Smart City Dashboard</h1>
    <p>Monitor & Predict Key Areas of Urban Life</p>

    <div class="nav-buttons">
        <button onclick="openModal('signinModal')">Sign In</button>
        <button onclick="openModal('signupModal')">Sign Up</button>
        <button onclick="showDetails()">Register</button>
    </div>
</header>

<main>
    <div class="card-container">
        <div class="card disaster" onclick="redirect('disaster.html')">
            <h2>Disaster Management</h2>
            <p>Track and manage disasters efficiently.</p>
        </div>

        <div class="card transport" onclick="redirect('transport.html')">
            <h2>Transport Delay Prediction</h2>
            <p>Predict delays using real-time data.</p>
        </div>

        <div class="card civic" onclick="redirect('civic.html')">
            <h2>Civic Issues</h2>
            <p>Report civic problems easily.</p>
        </div>
    </div>
</main>

<!-- User Details -->
<section id="userDetails">
    <h2>Registered User</h2>
    <p><strong>Name:</strong> <span id="displayName"></span></p>
    <p><strong>Email:</strong> <span id="displayEmail"></span></p>
    <button onclick="hideDetails()">Close</button>
</section>

<!-- Sign In Modal -->
<div id="signinModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('signinModal')">&times;</span>
        <h2>Sign In</h2>
        <input type="email" id="signinEmail" placeholder="Email">
        <input type="password" id="signinPassword" placeholder="Password">
        <button onclick="signIn()">Sign In</button>
    </div>
</div>

<!-- Sign Up Modal -->
<div id="signupModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('signupModal')">&times;</span>
        <h2>Sign Up</h2>
        <input type="text" id="signupName" placeholder="Full Name">
        <input type="email" id="signupEmail" placeholder="Email">
        <input type="password" id="signupPassword" placeholder="Password">
        <button onclick="signUp()">Register</button>
    </div>
</div>

<script>
    let registeredName = "";
    let registeredEmail = "";

    function redirect(page) {
        window.location.href = page;
    }

    function openModal(id) {
        document.getElementById(id).style.display = "block";
    }

    function closeModal(id) {
        document.getElementById(id).style.display = "none";
    }

    function signUp() {
        registeredName = document.getElementById("signupName").value;
        registeredEmail = document.getElementById("signupEmail").value;
        let pass = document.getElementById("signupPassword").value;

        if(registeredName && registeredEmail && pass) {
            alert("Registration successful!");
            closeModal("signupModal");
        } else {
            alert("Please fill all fields");
        }
    }

    function signIn() {
        alert("Sign in successful!");
        closeModal("signinModal");
    }

    function showDetails() {
        if(registeredName) {
            document.getElementById("displayName").innerText = registeredName;
            document.getElementById("displayEmail").innerText = registeredEmail;
            document.getElementById("userDetails").style.display = "block";
        } else {
            alert("No user registered yet!");
        }
    }

    function hideDetails() {
        document.getElementById("userDetails").style.display = "none";
    }

    window.onclick = function(e) {
        if(e.target.classList.contains("modal")) {
            e.target.style.display = "none";
        }
    }
</script>

</body>
</html>
